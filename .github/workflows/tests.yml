name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No OPENAI_API_KEY is configured, so the live smoke test skips and the
      # rest of the suite (including the real MCP stdio server) runs offline.
      - name: Run tests
        run: python -m pytest -q

      - name: Check no secrets are committed
        run: ./scripts/check_no_secrets.sh
